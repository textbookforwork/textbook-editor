<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>班級空狀態示意</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #e8e8e8; font-family: "PingFang TC", "Noto Sans TC", sans-serif; color: #1a1a1a; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .col { flex: 1; min-width: 420px; }
  .label { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .note { font-size: 13px; color: #666; margin-bottom: 10px; line-height: 1.6; }
  .screen { background: #F2F2F2; border-radius: 8px; padding: 12px 16px 16px; height: 520px; display: flex; flex-direction: column; border: 1px solid #ccc; }
  .top { display: flex; justify-content: space-between; align-items: center; height: 36px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
  .logo i { width: 22px; height: 22px; border-radius: 50%; background: #F0FF62; }
  .me { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .me i { width: 24px; height: 24px; border-radius: 50%; background: #222; color: #fff; font-style: normal; display: grid; place-items: center; font-size: 11px; }
  .tabs { display: flex; gap: 6px; margin: 8px 0; font-size: 11px; }
  .tabs span { padding: 6px 10px; border-radius: 999px; color: #666; }
  .tabs span.on { background: #fff; color: #1a1a1a; font-weight: 600; }
  .panel { flex: 1; background: #fff; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; position: relative; }
  .head { display: flex; justify-content: space-between; align-items: center; }
  .head b { font-size: 16px; }
  .head span { background: #222; color: #fff; font-size: 11px; padding: 6px 12px; border-radius: 999px; }
  .empty { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 12px; color: #555; }
  .empty i { width: 52px; height: 52px; border-radius: 50%; background: #f2f2f2; display: grid; place-items: center; font-style: normal; font-size: 22px; }
  .a .empty { margin-top: 70px; }
  .b .empty { flex: 1; justify-content: center; padding-bottom: 40px; }
  .guide { position: absolute; left: 0; right: 0; border-top: 1px dashed #e66; }
  .guide.mid { top: 50%; }
  .guide em { position: absolute; right: 6px; top: -16px; font-size: 10px; color: #e66; font-style: normal; }
</style>
</head>
<body>
<h1>班級星艦：還沒有班級時</h1>
<div class="row">
  <div class="col a">
    <div class="label">A　現在：偏上方</div>
    <div class="note">圖示固定在標題下方一段距離，下面留一大片空白，螢幕越高越空。</div>
    <div class="screen">
      <div class="top"><div class="logo"><i></i>數位教科書</div><div class="me">方小明 <i>方</i></div></div>
      <div class="tabs"><span>地球大廳</span><span class="on">班級星艦</span></div>
      <div class="panel">
        <div class="guide mid"><em>白框正中線</em></div>
        <div class="head"><b>班級星艦</b><span>＋ 新增班級</span></div>
        <div class="empty"><i>👻</i>還沒有班級，按「新增班級」開始吧。</div>
      </div>
    </div>
  </div>
  <div class="col b">
    <div class="label">B　建議：置中、略偏上</div>
    <div class="note">放在標題下方剩餘空間的中間，再往上提一點（視覺中心比幾何中心高），任何螢幕高度看起來都平衡。</div>
    <div class="screen">
      <div class="top"><div class="logo"><i></i>數位教科書</div><div class="me">方小明 <i>方</i></div></div>
      <div class="tabs"><span>地球大廳</span><span class="on">班級星艦</span></div>
      <div class="panel">
        <div class="guide mid"><em>白框正中線</em></div>
        <div class="head"><b>班級星艦</b><span>＋ 新增班級</span></div>
        <div class="empty"><i>👻</i>還沒有班級，按「新增班級」開始吧。</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
